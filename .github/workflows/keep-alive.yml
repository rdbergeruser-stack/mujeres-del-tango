name: Database Keep-Alive (Anti-Freeze)

on:
  schedule:
    # 4 veces por día: a las 00:00, 06:00, 12:00 y 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si se desea

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive via Vercel
        run: |
          echo "Consultando endpoint de keep-alive en producción..."
          curl -sS -X GET "https://mujeres-del-tango.vercel.app/api/cron/keep-alive" \
            -H "User-Agent: github-actions-keepalive" \
            --max-time 30
          echo ""
          echo "Ping de base de datos ejecutado exitosamente."
